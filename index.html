<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player — Tint</title>
    <meta
      name="description"
      content="Tint VideoPlayer — a reusable React video player with animated controls."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint so a stored preference never flashes the wrong
      // theme. Absent attributes are the defaults: no data-scheme follows the OS
      // via `color-scheme: light dark`, no data-theme is the built-in palette.
      // Kept inline and dependency-free — a deferred module would be too late.
      (function () {
        try {
          var root = document.documentElement
          var scheme = localStorage.getItem('tint-color-scheme')
          if (scheme === 'light' || scheme === 'dark') root.dataset.scheme = scheme
          var theme = localStorage.getItem('tint-theme')
          if (theme && theme !== 'tint') root.dataset.theme = theme
        } catch (error) {
          // Storage is unavailable (private mode, sandboxed frame). The page
          // still renders; it just follows the system instead.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/docs/main.tsx"></script>
  </body>
</html>
