name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Covers `tsc -b` (which type-checks the docs site and the compile-checked
      # usage fixture) followed by the Vite build.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
